<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Showreel — Sam Walcroft</title>
<meta name="description" content="Sam Walcroft's narrative and music video direction showreel — Brisbane film director and artist.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Inter+Tight:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --paper:#f4efe4; --ink:#161310; --ink-soft:#5c5648; --wine:#5a2333; --terracotta:#c17158; --mustard:#c9a227; --line:rgba(22,19,16,0.14);
    --serif:'Libre Caslon Display', Georgia, serif; --sans:'Inter Tight', system-ui, sans-serif;
  }
  html{scroll-behavior:smooth; cursor:none;}
  body{ font-family:var(--sans); background:var(--ink); color:var(--paper); line-height:1.7; cursor:none; }
  a, button{ cursor:none; }
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:1160px; margin:0 auto; padding-left:44px; padding-right:44px;}
  @media(max-width:700px){ .wrap{padding-left:24px; padding-right:24px;} }
  em{ font-style:italic; color:var(--terracotta); }
  #cursor{ position:fixed; top:0; left:0; width:10px; height:10px; border-radius:50%; background:var(--paper); pointer-events:none; z-index:200; transform:translate(-50%,-50%); transition:width 0.2s, height 0.2s, background 0.2s; }
  #cursor.hover{ width:44px; height:44px; background:var(--terracotta); }
  @media(max-width:900px){ #cursor{ display:none; } html,body{ cursor:auto; } a,button{ cursor:pointer; } }
  nav{ display:flex; align-items:center; justify-content:space-between; padding:26px 44px; }
  .nav-name{ font-family:var(--serif); font-size:1.05rem; }
  .nav-links{ display:flex; gap:24px; font-size:0.72rem; letter-spacing:0.08em; text-transform:uppercase; }
  .full-reel{ height:100vh; position:relative; display:flex; align-items:center; justify-content:center; background:linear-gradient(150deg,#3c1a24,#0e0705 70%); }
  .full-reel video{ width:100%; height:100%; object-fit:cover; }
  .full-reel-caption{ position:absolute; bottom:44px; left:44px; z-index:2; }
  .full-reel-caption .eyebrow{ font-size:0.7rem; letter-spacing:0.2em; text-transform:uppercase; opacity:0.7; margin-bottom:10px; }
  .full-reel-caption .title{ font-family:var(--serif); font-style:italic; font-size:clamp(1.8rem,4vw,3rem); }
  footer{ padding:20px 44px; display:flex; justify-content:space-between; align-items:center; background:repeating-linear-gradient(45deg, var(--mustard) 0 18px, var(--ink) 18px 36px); }
  footer .footer-name{ background:var(--paper); color:var(--ink); padding:8px 20px; font-family:var(--serif); font-size:0.9rem; }
</style>

</head>
<body>
<div id="cursor"></div>
<nav>
  <a href="index.html" class="nav-name">Sam Walcroft</a>
  <div class="nav-links"><a href="index.html">Back to Works</a></div>
</nav>

<section class="full-reel">
  <video autoplay muted loop playsinline poster="images/celestial-bodies.webp"></video>
  <div class="full-reel-caption">
    <div class="eyebrow">Showreel</div>
    <div class="title">Narrative &amp; Music Video Direction</div>
  </div>
</section>

<footer>
  <div class="footer-name">Sam Walcroft</div>
  <div style="font-size:0.8rem; opacity:0.85;">Film Director &amp; Artist</div>
</footer>
<script>
  const cursor = document.getElementById('cursor');
  window.addEventListener('mousemove', (e) => { cursor.style.left = e.clientX + 'px'; cursor.style.top = e.clientY + 'px'; });
  document.querySelectorAll('a, button').forEach(el => {
    el.addEventListener('mouseenter', () => cursor.classList.add('hover'));
    el.addEventListener('mouseleave', () => cursor.classList.remove('hover'));
  });
</script>
</body>
</html>
