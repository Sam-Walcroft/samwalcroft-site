<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Good Intns Club — Sam Walcroft</title>
<meta name="description" content="The Good Intns Club — Ads &amp; Commercial. TVC — Videographer. Full video by Sam Walcroft.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Inter+Tight:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --accent:#c1663a;
    --display:'Libre Caslon Display', Georgia, serif;
    --sans:'Inter Tight', system-ui, sans-serif;
  }
  html{scroll-behavior:smooth; cursor:none;}
  body{
    font-family:var(--sans); background:#0c0b09; color:#f4efe4; line-height:1.6; cursor:none;
    min-height:100vh; position:relative; overflow-x:hidden;
  }
  a, button{ cursor:none; }
  a{ color:inherit; text-decoration:none; }
  @media(max-width:900px){ html,body{ cursor:auto; } a,button{ cursor:pointer; } }

  #cursor{
    position:fixed; top:0; left:0; width:10px; height:10px; border-radius:50%;
    background:#f4efe4; pointer-events:none; z-index:200; transform:translate(-50%,-50%);
    transition:width 0.2s, height 0.2s, background 0.2s;
  }
  #cursor.hover{ width:44px; height:44px; background:var(--accent); }
  @media(max-width:900px){ #cursor{ display:none; } }

  #mesh-bg{ position:fixed; inset:0; z-index:-1; overflow:hidden; background:#0c0b09; }
  .blob{ position:absolute; border-radius:50%; filter:blur(80px); will-change:transform; }
  .blob1{ width:60vw; height:60vw; top:-14%; left:-12%; background:var(--accent); opacity:0.55; animation:drift1 26s ease-in-out infinite alternate; }
  .blob2{ width:48vw; height:48vw; bottom:-16%; right:-8%; background:var(--accent2); opacity:0.4; animation:drift2 32s ease-in-out infinite alternate; }
  .blob3{ width:36vw; height:36vw; top:32%; right:18%; background:#f4efe4; opacity:0.07; animation:drift3 20s ease-in-out infinite alternate; }
  @keyframes drift1{ from{transform:translate(0,0) scale(1);} to{transform:translate(7%,9%) scale(1.18);} }
  @keyframes drift2{ from{transform:translate(0,0) scale(1);} to{transform:translate(-9%,-7%) scale(1.12);} }
  @keyframes drift3{ from{transform:translate(0,0);} to{transform:translate(-12%,11%);} }

  .reel-nav{
    position:relative; z-index:5; display:flex; align-items:center; justify-content:space-between;
    padding:30px 44px;
  }
  @media(max-width:700px){ .reel-nav{ padding:22px 24px; } }
  .reel-back{
    font-size:0.72rem; letter-spacing:0.1em; text-transform:uppercase; opacity:0.75;
    border-bottom:1px solid rgba(244,239,228,0.4); padding-bottom:3px; transition:opacity 0.25s;
  }
  .reel-back:hover{ opacity:1; }
  .reel-wordmark{ font-family:var(--display); font-style:italic; font-size:0.95rem; opacity:0.85; }

  .reel-stage{
    position:relative; z-index:2; min-height:calc(100vh - 90px);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:20px 24px 90px; text-align:center;
  }
  .reel-video-wrap{ width:100%; display:flex; justify-content:center; }
  .reel-video-wrap video{
    max-width:min(84vw, 1120px); max-height:70vh; width:auto; height:auto;
    border-radius:10px; background:#000; display:block;
    box-shadow:0 70px 130px -35px rgba(0,0,0,0.7), 0 0 0 1px rgba(244,239,228,0.07);
  }
  .reel-placeholder{
    width:min(84vw,1120px); aspect-ratio:16/9; border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    background:rgba(244,239,228,0.04); box-shadow:0 0 0 1px rgba(244,239,228,0.08);
    font-size:0.8rem; letter-spacing:0.08em; text-transform:uppercase; opacity:0.55;
  }
  .reel-caption{ margin-top:36px; max-width:44ch; }
  .reel-caption .cat{ font-size:0.72rem; letter-spacing:0.2em; text-transform:uppercase; opacity:0.65; margin-bottom:14px; }
  .reel-caption .title{ font-family:var(--display); font-style:italic; font-size:clamp(1.8rem,4vw,2.8rem); }
  .reel-caption .role{ font-size:0.9rem; opacity:0.7; margin-top:10px; }
</style>
</head>
<body>
<div id="cursor"></div>
<div id="mesh-bg">
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>
</div>

<nav class="reel-nav">
  <a class="reel-back" href="../index.html">&larr; Back to Work</a>
  <a class="reel-wordmark" href="../index.html">Sam Walcroft</a>
</nav>

<section class="reel-stage">
  <div class="reel-video-wrap">
    <video controls playsinline preload="metadata" poster="../images/good-intns-club.webp" src="../videos/good-intns-club-full.mp4"></video>
  </div>
  <div class="reel-caption">
    <div class="cat">Ads &amp; Commercial</div>
    <div class="title">The Good Intns Club</div>
    <div class="role">TVC — Videographer</div>
  </div>
</section>

<script>
  const cursor = document.getElementById('cursor');
  window.addEventListener('mousemove', (e) => {
    cursor.style.left = e.clientX + 'px';
    cursor.style.top = e.clientY + 'px';
  });
  document.querySelectorAll('a, button').forEach(el => {
    el.addEventListener('mouseenter', () => cursor.classList.add('hover'));
    el.addEventListener('mouseleave', () => cursor.classList.remove('hover'));
  });
</script>
</body>
</html>
