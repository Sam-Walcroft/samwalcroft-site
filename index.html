<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sam Walcroft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Inter+Tight:ital,wght@0,300;0,400;0,500&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --paper:#f4efe4;
    --ink:#1a1712;
    --ink-soft:#4a453d;
    --serif:'Libre Caslon Display', Georgia, serif;
    --sans:'Inter Tight', system-ui, sans-serif;
  }
  html,body{height:100%;}
  body{
    background:var(--paper); color:var(--ink); font-family:var(--sans);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:32px;
  }
  .name{font-family:var(--serif); font-size:clamp(2.4rem,7vw,4.2rem); letter-spacing:0.02em;}
  .sub{margin:14px 0 64px; color:var(--ink-soft); font-size:0.95rem; letter-spacing:0.04em;}
  .doors{display:flex; gap:24px; flex-wrap:wrap; justify-content:center;}
  .door{
    width:260px; padding:40px 28px; border:1px solid rgba(26,23,18,0.2);
    display:flex; flex-direction:column; gap:10px; align-items:center;
    transition:background 0.25s, border-color 0.25s;
  }
  .door:hover{background:var(--ink); border-color:var(--ink);}
  .door:hover .door-title, .door:hover .door-desc{color:var(--paper);}
  .door-title{font-family:var(--serif); font-style:italic; font-size:1.4rem; transition:color 0.25s;}
  .door-desc{font-size:0.82rem; color:var(--ink-soft); transition:color 0.25s;}
  footer{margin-top:64px; font-size:0.75rem; color:var(--ink-soft);}
</style>
</head>
<body>
  <div class="name">Sam Walcroft</div>
  <div class="sub">Film Director &amp; Artist &nbsp;·&nbsp; Videographer &amp; Marketer</div>
  <div class="doors">
    <a class="door" href="/director/">
      <div class="door-title">Narrative Work</div>
      <div class="door-desc">Film direction, writing &amp; artistic practice</div>
    </a>
    <a class="door" href="/commercial/">
      <div class="door-title">Commercial &amp; Marketing Work</div>
      <div class="door-desc">Videography, social media &amp; client projects</div>
    </a>
  </div>
  <footer>Brisbane, Australia</footer>
</body>
</html>
